<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter Waiting for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4f7; --bg2:#fde3ec; --paper:#fffafb; --petal:#f8cddb; --rose:#c2587a;
  --rose-soft:#e9a0b8; --ink:#6a3548; --muted:#a2667c; --shadow:rgba(214,110,150,.2);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1a22; --bg2:#3a2230; --paper:#33202a; --petal:#6b3a4e; --rose:#e48aa8;
    --rose-soft:#a85d78; --ink:#fbe4ec; --muted:#d6a3b6; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1a22; --bg2:#3a2230; --paper:#33202a; --petal:#6b3a4e; --rose:#e48aa8;
  --rose-soft:#a85d78; --ink:#fbe4ec; --muted:#d6a3b6; --shadow:rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--bg1);
  background-image:radial-gradient(60rem 30rem at 15% -5%, var(--bg2), transparent 60%),
                   radial-gradient(50rem 28rem at 100% 100%, var(--bg2), transparent 60%);
  background-attachment:fixed;
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif; font-size:1.2rem; line-height:1.6;
}
.wrap{max-width:660px; margin:0 auto; padding:34px 20px 56px; text-align:center}
h1{
  font-family:"Pinyon Script","Snell Roundhand",cursive; font-weight:400;
  font-size:clamp(2.6rem,9vw,3.6rem); line-height:1.1; margin:0 0 6px; color:var(--rose);
}
.sub{margin:0 0 26px; font-style:italic; color:var(--muted)}

/* The letter: the one memorable element */
.letter{
  position:relative; background:var(--paper); border:1px solid var(--petal); border-radius:28px;
  padding:30px 28px; box-shadow:0 18px 50px -18px var(--shadow); text-align:left;
  transition:box-shadow .8s, transform .8s;
}
.letter::before{content:""; position:absolute; inset:8px; border:1px solid var(--petal); border-radius:21px; opacity:.55; pointer-events:none}
.letter p{margin:0; position:relative; font-style:italic; font-size:clamp(1.25rem,3.8vw,1.6rem); line-height:1.75; overflow-wrap:anywhere}
.word{display:inline-block; margin-right:.3em; white-space:nowrap}
.word.hidden{color:var(--rose-soft); letter-spacing:.12em; user-select:none}
.word.shown{color:var(--ink); animation:unveil 1.1s ease both; animation-delay:calc(var(--i) * 70ms)}
@keyframes unveil{from{opacity:0; filter:blur(7px); transform:translateY(3px)}to{opacity:1; filter:blur(0); transform:none}}
.letter.done{box-shadow:0 24px 70px -14px var(--shadow); transform:scale(1.015)}

.hearts{display:flex; justify-content:center; gap:10px; margin:24px 0 6px; font-size:1.3rem; color:var(--petal)}
.hearts span{transition:color .6s, transform .6s}
.hearts span.on{color:var(--rose); transform:scale(1.2)}

.panel{background:color-mix(in srgb, var(--paper) 70%, transparent); border:1px solid var(--petal); border-radius:20px; padding:24px 22px; margin-top:12px}
.q{font-size:clamp(1.35rem,4.4vw,1.7rem); line-height:1.35; margin:0 0 18px; font-weight:600}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
input{
  flex:1 1 220px; min-width:0; font:inherit; font-size:1.2rem; color:var(--ink); background:var(--paper);
  border:1.5px solid var(--petal); border-radius:999px; padding:11px 20px; text-align:center;
}
input::placeholder{color:var(--muted); opacity:.7}
input:focus-visible,button:focus-visible{outline:3px solid var(--rose-soft); outline-offset:2px}
button{
  font:inherit; font-weight:600; font-size:1.1rem; cursor:pointer; border:0; border-radius:999px;
  padding:11px 26px; background:var(--rose); color:#fff; transition:transform .2s, filter .2s;
}
:root[data-theme="dark"] button{color:#2a1a22}
button:hover{filter:brightness(1.06); transform:translateY(-1px)}
button:disabled{opacity:.6; cursor:default; transform:none}
button.ghost{background:transparent; color:var(--rose); border:1.5px solid var(--petal)}
.msg{min-height:1.7em; margin:14px 0 0; font-style:italic; color:var(--muted)}
.msg.ok{color:var(--rose)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.final{font-size:1.35rem; margin:0 0 18px}

.petal{position:fixed; top:-30px; pointer-events:none; z-index:5; border-radius:150% 0 150% 0; background:var(--petal); opacity:.85; animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg); opacity:.2}}
@media (prefers-reduced-motion: reduce){
  .word.shown{animation:none} .shake{animation:none} .letter,.hearts span,button{transition:none}
}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <section class="letter" id="letter" aria-label="The hidden letter"><p id="letterText"></p></section>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <section class="panel" id="panel"></section>
</main>

<script>
/* ==========================================================
   EDIT HERE — your questions, answers and secret message
   ========================================================== */
const CONFIG = {
  title: "A Letter for You",
  subtitle: "Answer each question to unlock a little more of my message.",

  // Each question: the text, every accepted answer, and an optional hint.
  // Answers ignore capital letters, extra spaces and punctuation.
  questions: [
    { question: "Where did we first meet?",         answers: ["the library", "library"],  hint: "Lots of books, very quiet." },
    { question: "What is my favorite flower?",      answers: ["peony", "peonies"],        hint: "Soft pink, very full." },
    { question: "What song did we dance to?",       answers: ["perfect"],                 hint: "One word." },
    { question: "In what month is our anniversary?", answers: ["june"] },
    { question: "What do I call you?",              answers: ["my love", "love"],         hint: "" }
  ],

  // The secret message. Two ways to write it:
  // 1) A single string: it is split into equal parts, one part per question.
  // 2) An array of strings: part 1 unlocks after question 1, and so on.
  //    (Use an array if you want full control over what each answer reveals.)
  secret: [
    "From the very first day,",
    "you felt like a soft spring morning.",
    "Every moment with you",
    "is a small, quiet miracle",
    "and I love you more each day."
  ],

  // Text and wording
  placeholder: "Type your answer…",
  checkButton: "Unlock",
  hintButton: "Need a hint?",
  correctMessages: ["Yes, exactly.", "That's it.", "You remembered.", "Right again.", "Perfect."],
  wrongMessages: ["Not quite — try once more.", "Close, but not yet.", "Take your time and try again."],
  finalNote: "You unlocked every word. This letter is yours.",
  playAgain: "Read it again",

  hiddenChar: "*",       // character used to mask words
  advanceDelay: 1500     // ms to wait after a correct answer
};
/* ==========================================================
   GAME ENGINE — no need to edit below
   ========================================================== */
(function () {
  const Q = CONFIG.questions;
  const $ = (id) => document.getElementById(id);
  const letterEl = $("letter"), textEl = $("letterText"), heartsEl = $("hearts"), panel = $("panel");
  let step = 0, chunks = [];

  const normalize = (s) => String(s).toLowerCase().replace(/ё/g, "е")
    .replace(/[^\p{L}\p{N}\s]/gu, "").replace(/\s+/g, " ").trim();
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // Split the secret into one chunk (array of words) per question
  function buildChunks() {
    if (Array.isArray(CONFIG.secret)) {
      return Q.map((_, i) => (CONFIG.secret[i] || "").split(/\s+/).filter(Boolean));
    }
    const words = CONFIG.secret.split(/\s+/).filter(Boolean), n = Q.length;
    return Q.map((_, i) => words.slice(Math.floor(i * words.length / n), Math.floor((i + 1) * words.length / n)));
  }

  // The real words are only kept in memory until revealed
  function renderLetter() {
    textEl.innerHTML = "";
    chunks.forEach((words, c) => words.forEach((w) => {
      const s = document.createElement("span");
      s.className = "word hidden";
      s.dataset.chunk = c;
      s.dataset.len = w.length;
      s.textContent = CONFIG.hiddenChar.repeat(Math.max(2, w.length));
      textEl.appendChild(s);
      textEl.appendChild(document.createTextNode(" "));
    }));
  }

  function reveal(c) {
    let i = 0;
    textEl.querySelectorAll('.word[data-chunk="' + c + '"]').forEach((el, k) => {
      el.textContent = chunks[c][k];
      el.className = "word shown";
      el.style.setProperty("--i", i++);
    });
  }

  function renderHearts() {
    heartsEl.innerHTML = Q.map((_, i) => '<span class="' + (i < step ? "on" : "") + '">♥</span>').join("");
  }

  function renderQuestion() {
    const q = Q[step];
    panel.innerHTML =
      '<p class="q"></p>' +
      '<div class="row"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">' +
      '<button id="go" type="button"></button></div>' +
      (q.hint ? '<p style="margin:14px 0 0"><button id="hintBtn" class="ghost" type="button"></button></p>' : "") +
      '<p class="msg" id="msg" aria-live="polite"></p>';
    panel.querySelector(".q").textContent = q.question;
    const input = $("ans"), go = $("go"), msg = $("msg");
    input.placeholder = CONFIG.placeholder;
    go.textContent = CONFIG.checkButton;
    if (q.hint) {
      const hb = $("hintBtn");
      hb.textContent = CONFIG.hintButton;
      hb.onclick = () => { msg.className = "msg"; msg.textContent = q.hint; input.focus(); };
    }

    const submit = () => {
      if (go.disabled) return;
      const given = normalize(input.value);
      if (!given) return;
      if (q.answers.some((a) => normalize(a) === given)) {
        go.disabled = input.disabled = true;
        msg.className = "msg ok";
        msg.textContent = pick(CONFIG.correctMessages);
        reveal(step);
        step++;
        renderHearts();
        setTimeout(step < Q.length ? renderQuestion : finish, CONFIG.advanceDelay);
      } else {
        msg.className = "msg";
        msg.textContent = pick(CONFIG.wrongMessages);
        input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
        input.select();
      }
    };
    go.onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
    input.focus({ preventScroll: true });
  }

  function finish() {
    letterEl.classList.add("done");
    panel.innerHTML = '<p class="final"></p><button id="again" type="button"></button>';
    panel.querySelector(".final").textContent = CONFIG.finalNote;
    const again = $("again");
    again.textContent = CONFIG.playAgain;
    again.onclick = start;
    petals();
  }

  function petals() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 26; i++) {
      const p = document.createElement("span");
      const size = 10 + Math.random() * 12;
      p.className = "petal";
      p.style.cssText = "left:" + Math.random() * 100 + "vw;width:" + size + "px;height:" + size * 1.3 + "px;" +
        "--dx:" + (Math.random() * 160 - 80) + "px;animation-duration:" + (6 + Math.random() * 5) + "s;" +
        "animation-delay:" + Math.random() * 2.5 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 14000);
    }
  }

  function start() {
    step = 0;
    letterEl.classList.remove("done");
    chunks = buildChunks();
    renderLetter();
    renderHearts();
    renderQuestion();
  }

  $("title").textContent = CONFIG.title;
  $("subtitle").textContent = CONFIG.subtitle;
  document.title = CONFIG.title;
  start();
})();
</script>
</body>
</html>
