<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Құпия хат</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff5f8;--bg2:#ffe3ec;--card:rgba(255,255,255,.72);--field:rgba(255,255,255,.8);--ink:#8a4a60;--soft:#c98aa3;--acc:#f4a6c0;--acc2:#e8789f;--line:#f8cfdd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1620;--bg2:#3a1d2b;--card:rgba(60,32,45,.7);--field:rgba(40,20,30,.7);--ink:#ffd9e6;--soft:#d9a1b7;--acc:#e58aab;--acc2:#f4a6c0;--line:#6b3a50}}
:root[data-theme="dark"]{--bg1:#2a1620;--bg2:#3a1d2b;--card:rgba(60,32,45,.7);--field:rgba(40,20,30,.7);--ink:#ffd9e6;--soft:#d9a1b7;--acc:#e58aab;--acc2:#f4a6c0;--line:#6b3a50}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,var(--bg2),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;overflow-x:hidden}
main{width:100%;max-width:560px;margin:auto;padding:28px 18px 40px;position:relative;z-index:1}
h1{font-size:2.6rem;font-style:italic;font-weight:400;text-align:center;margin:0 0 6px}
.sub{text-align:center;color:var(--soft);margin:0 0 24px;font-size:1.15rem}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;padding:28px 24px;margin-bottom:22px;box-shadow:0 20px 50px -22px rgba(232,120,159,.45)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
#n{margin:0;text-align:center;letter-spacing:.18em;text-transform:uppercase;font-size:.95rem;color:var(--soft)}
#q{font-size:1.65rem;font-weight:600;text-align:center;margin:10px 0 22px;line-height:1.35}
input{width:100%;padding:14px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:1.2rem;text-align:center;outline:none;transition:.25s}
input:focus{border-color:var(--acc2);box-shadow:0 0 0 4px rgba(244,166,192,.28)}
input::placeholder{color:var(--soft)}
button{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:inherit;font-size:1.2rem;letter-spacing:.08em;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 24px -10px var(--acc2)}
button:hover{transform:translateY(-2px)}
#msg{min-height:1.5em;margin:14px 0 0;text-align:center;font-style:italic;font-size:1.15rem;color:var(--soft)}
#msg.bad{color:var(--acc2)}
h2{margin:0 0 14px;text-align:center;font-weight:400;font-style:italic;font-size:1.4rem}
#secret{margin:0;text-align:center;font-size:1.5rem;line-height:1.9}
.w{display:inline-block;color:var(--soft);letter-spacing:.15em}
.w.open{color:var(--ink);letter-spacing:normal;animation:pop 1s ease}
#secret.final{font-size:1.75rem;text-shadow:0 0 18px rgba(244,166,192,.7)}
@keyframes pop{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.petal{position:fixed;top:-40px;color:var(--acc);opacity:.55;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}}
</style>
</head>
<body>
<main>
<h1>Құпия хат</h1>
<p class="sub">Әр дұрыс жауап құпия хабарламаның бір бөлігін ашады</p>
<section class="card" id="card">
<div class="bar"><i id="bar"></i></div>
<p id="n"></p>
<h3 id="q"></h3>
<form id="f"><input id="a" autocomplete="off" placeholder="Жауапты енгізіңіз"><button>Тексеру</button></form>
<p id="msg"></p>
<button id="again" hidden>Қайта бастау</button>
</section>
<section class="card"><h2>Құпия хабарлама</h2><p id="secret"></p></section>
</main>
<script>
const GAME={
questions:[
{q:"Қазақстанның астанасы қай қала?",a:["Астана"]},
{q:"Бір аптада неше күн бар?",a:["7","жеті"]},
{q:"Күн қай жақтан шығады?",a:["шығыс","шығыстан"]},
{q:"Бір жылда неше ай бар?",a:["12","он екі"]},
{q:"Гүлдердің патшайымы деп қай гүлді атайды?",a:["раушан","раушан гүл"]}
],
secret:"Сен менің жүрегімдегі ең жылы жарықсың, сенімен бірге әрбір күн мерекеге айналады."
};
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
const words=GAME.secret.split(/\s+/);
const total=GAME.questions.length;
const box=$("secret");
box.innerHTML=words.map(()=>'<span class="w"></span>').join(" ");
const spans=[...box.children];
let step=0;
function paint(){
const shown=Math.ceil(words.length*step/total);
spans.forEach((s,i)=>{
if(i<shown){if(s.className!=="w open"){s.className="w open";s.textContent=words[i]}}
else{s.className="w";s.textContent="*".repeat(Math.max(3,words[i].length))}
});
$("bar").style.width=(step/total*100)+"%";
}
function ask(){
$("n").textContent="Сұрақ "+(step+1)+" / "+total;
$("q").textContent=GAME.questions[step].q;
$("a").value="";
$("a").focus();
}
function say(t,bad){$("msg").textContent=t;$("msg").className=bad?"bad":""}
function finish(){
$("n").textContent="";
$("q").textContent="Құттықтаймыз! ♡";
$("f").hidden=true;
$("again").hidden=false;
box.classList.add("final");
say("Барлық сұрақтарға дұрыс жауап бердіңіз!");
}
$("f").onsubmit=e=>{
e.preventDefault();
const v=norm($("a").value);
if(!v){say("Алдымен жауапты енгізіңіз",true);return}
const ok=GAME.questions[step].a.some(x=>norm(x)===v);
if(!ok){
say("Қате жауап, тағы бір рет көріңіз",true);
const c=$("card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
return;
}
step++;
paint();
if(step===total){finish();return}
say("Дұрыс! ♡");
setTimeout(()=>{say("");ask()},900);
};
$("again").onclick=()=>{
step=0;
box.classList.remove("final");
$("f").hidden=false;
$("again").hidden=true;
say("");
paint();
ask();
};
for(let i=0;i<14;i++){
const p=document.createElement("span");
p.className="petal";
p.textContent=i%3?"✿":"♡";
p.style.left=Math.random()*100+"vw";
p.style.fontSize=(14+Math.random()*16)+"px";
p.style.animationDuration=(9+Math.random()*9)+"s";
p.style.animationDelay=(-Math.random()*15)+"s";
document.body.appendChild(p);
}
paint();
ask();
</script>
</body>
</html>
